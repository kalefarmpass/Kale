name: Windows VNC
on: [workflow_dispatch]   # manual trigger

jobs:
  vnc:
    runs-on: windows-latest
    steps:
      - name: Install TightVNC
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://www.tightvnc.com/download/2.8.81/tightvnc-2.8.81-setup-64bit.msi" -OutFile tightvnc.msi
          Start-Process msiexec -ArgumentList '/i','tightvnc.msi','/qn','ADDLOCAL=Server' -Wait

      - name: Set VNC password
        shell: cmd
        run: |
          "C:\Program Files\TightVNC\tvncpwd.exe" -password 1234
          reg add "HKCU\Software\TightVNC\Server" /v Password /t REG_BINARY /f /d 00ffeeddccbbaa99

      - name: Start VNC server
        shell: cmd
        run: start "" "C:\Program Files\TightVNC\tvnserver.exe" -run

      - name: Download ngrok
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          ./ngrok.exe config add-authtoken 3M9b7yCRO2Kwo9FSt56MP69kWcp_5TQNUV9q4E1FgZupQtPVG

      - name: Open TCP tunnel to 5900
        shell: powershell
        run: |
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp","5900" -NoNewWindow
          Start-Sleep -Seconds 10
          (Invoke-WebRequest "http://127.0.0.1:4040/api/tunnels").Content
